version: "2"
run:
  go: "1.24"
  tests: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
  disable:
    - exhaustive
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - godot
    - godox
    - lll
    - nlreturn
    - paralleltest
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*bufio.Writer).Flush
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
        - (github.com/gofiber/fiber/v2.Ctx).JSON
        - (github.com/gofiber/fiber/v2.Ctx).SendStatus
        - (*testing.T).Run
        - (*testing.B).Run
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - style
        - performance
    gosec:
      excludes:
        - G104
        - G304
        - G404
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -SA1029
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - revive
        path: _test\.go
      - linters:
          - errcheck
        path: _test\.go
        text: Error return value
      - linters:
          - staticcheck
        text: SA9003
      - linters:
          - errcheck
        path: benchmark
      - linters:
          - govet
        path: _test\.go
        text: shadow
      - linters:
          - errcheck
        text: Error return value of `fmt.Sscanf`
      - linters:
          - errcheck
        text: Error return value of .*.Close
      - linters:
          - errcheck
        path: _test\.go
        text: Error return value of `json.NewDecoder
      - linters:
          - errcheck
        source: 'defer '
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/neogan74/konsul
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
